# Bu araç @keyiflerolsun tarafından | @KekikAkademi için yazılmıştır.
# ! Derleyici.yml sadece master'a push'ta çalışır; bu iş akışı PR'ları ve elle tetiklemeyi derler.
# ! Hiçbir yere yükleme yapmaz (builds dalına dokunmaz), sadece derlemeyi doğrular.
name: Derleme Testi

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  DerlemeTesti:
    runs-on: ubuntu-latest

    steps:
      - name: Depo Kontrolü
        uses: actions/checkout@v4.2.2

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 17

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3.2.2

      - name: Eklenti Denetimi
        run: python3 ARACLAR/eklenti.py dogrula

      - name: Eklentileri Derle
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew make makePluginsJson 2>&1 | tee derleme.log

      - name: Derleme Sonucu
        if: always()
        run: |
          echo "### Derleme çıktıları" >> $GITHUB_STEP_SUMMARY
          echo "Derlenen eklenti: $(ls -1 */build/*.cs3 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY

      # ! Hata ayıklamayı kolaylaştırmak için hataları annotation olarak yayınla
      - name: Hataları Bildir
        if: failure()
        run: |
          {
            echo "### Derleme hataları"
            grep -E "^e: |^w: .*[Ee]rror|error:|FAILURE:|What went wrong|Execution failed" derleme.log | head -40 || true
          } >> $GITHUB_STEP_SUMMARY
          grep -E "^e: " derleme.log | head -15 | while IFS= read -r satir; do
            echo "::error::${satir}"
          done
