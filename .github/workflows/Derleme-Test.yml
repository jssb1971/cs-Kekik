# Bu araç @keyiflerolsun tarafından | @KekikAkademi için yazılmıştır.
# ! Derleyici.yml sadece master'a push'ta çalışır; bu iş akışı PR'ları ve elle tetiklemeyi derler.
# ! Hiçbir yere yükleme yapmaz (builds dalına dokunmaz), sadece derlemeyi doğrular.
name: Derleme Testi

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  DerlemeTesti:
    runs-on: ubuntu-latest

    steps:
      - name: Depo Kontrolü
        uses: actions/checkout@v4.2.2

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 17

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3.2.2

      - name: Eklenti Denetimi
        run: python3 ARACLAR/eklenti.py dogrula

      - name: Eklentileri Derle
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew make makePluginsJson --continue --console=plain 2>&1 | tee derleme.log

      - name: Derleme Sonucu
        if: always()
        run: |
          echo "### Derleme çıktıları" >> $GITHUB_STEP_SUMMARY
          echo "Derlenen eklenti: $(ls -1 */build/*.cs3 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY

      # ! Hata ayıklamayı kolaylaştırmak için derleme çıktısındaki hataları annotation olarak yayınla
      - name: Hataları Bildir
        if: failure()
        run: |
          bildir() {
            satir=$(printf '%s' "$1" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | cut -c1-500)
            echo "::error::${satir}"
          }

          {
            echo "### Derleme hataları"
            grep -E "^e: " derleme.log | head -30 || true
            echo "--- son 25 satır ---"
            tail -25 derleme.log
          } >> $GITHUB_STEP_SUMMARY

          grep -E "^e: " derleme.log | head -15 | while IFS= read -r satir; do bildir "$satir"; done
          # ! "Could not resolve" hatasının sebebini (sonraki 6 satır) bildir
          grep -n -A 6 "Could not resolve" derleme.log | head -40 | while IFS= read -r satir; do [ -n "$satir" ] && bildir "ÇÖZÜMLEME » $satir"; done
          tail -15 derleme.log | while IFS= read -r satir; do [ -n "$satir" ] && bildir "SON » $satir"; done
